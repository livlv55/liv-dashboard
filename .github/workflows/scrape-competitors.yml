name: Scrape Competitor Events

on:
  schedule:
    - cron: '0 14 * * *'   # 7am PT daily (14:00 UTC)
  workflow_dispatch:         # allow manual run from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        run: node scripts/scrape.mjs

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add competitor-data.json
          git diff --staged --quiet || git commit -m "chore: update competitor event data [skip ci]"
          git push
